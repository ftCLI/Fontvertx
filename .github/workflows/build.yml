name: Build apps

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src/fontvertx/__init__.py)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=Fontvertx-$version-windows-x64.zip" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Show PyInstaller warnings
        if: always()
        shell: bash
        run: cat build/windows/work/fontvertx/warn-fontvertx.txt || true

      - name: Test the CLI
        shell: bash
        env:
          CLI: build/windows/dist/Fontvertx/fontvertx-cli.exe
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fonts=tests/fixtures/fonts
          out="$RUNNER_TEMP/cli-test"
          rm -rf "$out"

          printed="$("$CLI" --version)"
          echo "$printed"
          test "$printed" = "Fontvertx $VERSION"

          "$CLI" ttf2otf "$fonts/IBMPlexSans-Regular.ttf" --output-dir "$out/otf"
          test -f "$out/otf/IBMPlexSans-Regular.otf"

          "$CLI" otf2ttf "$fonts/IBMPlexSans-Regular.otf" --autohint --output-dir "$out/ttf"
          test -f "$out/ttf/IBMPlexSans-Regular.ttf"

          "$CLI" ft2wf "$fonts/IBMPlexSans-Regular.ttf" --woff2 --output-dir "$out/web"
          test -f "$out/web/IBMPlexSans-Regular.woff2"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.zip }}
          path: build/windows/${{ steps.version.outputs.zip }}
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Read version
        id: version
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src/fontvertx/__init__.py)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=Fontvertx-$version-macos-arm64.zip" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./packaging/macos/build.sh

      - name: Show PyInstaller warnings
        if: always()
        run: cat build/macos/work/fontvertx/warn-fontvertx.txt || true

      - name: Test the CLI
        env:
          CLI: build/macos/dist/Fontvertx.app/Contents/MacOS/fontvertx-cli
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fonts=tests/fixtures/fonts
          out="$RUNNER_TEMP/cli-test"
          rm -rf "$out"

          printed="$("$CLI" --version)"
          echo "$printed"
          test "$printed" = "Fontvertx $VERSION"

          "$CLI" ttf2otf "$fonts/IBMPlexSans-Regular.ttf" --output-dir "$out/otf"
          test -f "$out/otf/IBMPlexSans-Regular.otf"

          "$CLI" otf2ttf "$fonts/IBMPlexSans-Regular.otf" --autohint --output-dir "$out/ttf"
          test -f "$out/ttf/IBMPlexSans-Regular.ttf"

          "$CLI" ft2wf "$fonts/IBMPlexSans-Regular.ttf" --woff2 --output-dir "$out/web"
          test -f "$out/web/IBMPlexSans-Regular.woff2"

      - name: Test that the GUI starts
        env:
          QT_QPA_PLATFORM: offscreen
          FONTVERTX_LOG_DIR: ${{ runner.temp }}/fontvertx-logs
        run: |
          build/macos/dist/Fontvertx.app/Contents/MacOS/Fontvertx &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "The GUI is still running after 15 seconds."
            kill "$pid"
            wait "$pid" || true
          else
            status=0
            wait "$pid" || status=$?
            echo "::error::The GUI exited early with code $status."
            tail -n 100 "$FONTVERTX_LOG_DIR/fontvertx.log" || echo "No Fontvertx log found."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.zip }}
          path: build/macos/${{ steps.version.outputs.zip }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Fontvertx-*
          path: dist/
          merge-multiple: true
      - name: Upload the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist/
          for zip in dist/*.zip; do
            gh release upload "$TAG" "$zip" --clobber
          done
