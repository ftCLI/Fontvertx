[project]
name = "fontvertx"
version = "1.1.0"
description = "A free, open-source font converter for the desktop and the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cesare Gilento", email = "ftCLI@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "cffsubr>=0.4.0",
    "click>=8.5.1,<9",
    "fonttools[pathops,woff]>=4.68.0",
    "pathvalidate>=3.3.1",
    "PySide6-Essentials>=6.12.0",
    "ttfautohint-py>=0.6.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Fonts",
]

[project.scripts]
fontvertx-cli = "fontvertx.cli:main"

[project.gui-scripts]
fontvertx = "fontvertx.__main__:main"

[project.urls]
Homepage = "https://github.com/ftCLI/Fontvertx"
Documentation = "https://github.com/ftCLI/Fontvertx/blob/main/docs/manual.md"
Issues = "https://github.com/ftCLI/Fontvertx/issues"
Changelog = "https://github.com/ftCLI/Fontvertx/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.1",
]
build = ["pyinstaller>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fontvertx --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fontvertx"
